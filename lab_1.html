<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>О себе</title>
    <style>
        
        body {
            background-color: #ffe4e1; 
            color: #333333;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        header, footer {
            background-color: #ffb6c1; 
            padding: 15px;
            border-radius: 5px;
        }
        aside {
            background-color: #ffc0cb;
            padding: 15px;
            border-left: 5px solid #ff1493;
            margin: 20px 0;
        }
        img {
            border: 3px solid #ff1493; 
            display: block;
            margin-bottom: 20px;
        }
        button {
            background-color: #ff1493; 
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>О себе</h1>
        <p>Ялпута Семён</p>
    </header>

    <main>
        <img src="photo_web.jpg" alt="Портрет дизайнера" width="200" height="200">

        <section>
            <h2>Навыки</h2>
            <ul>
                <li>Работа с макетами</li>
                <li>Понимание типографики</li>
                <li>Цветовая теория</li>
            </ul>
        </section>

        <section>
            <h2>Проекты</h2>
            <ol>
                <li>Разработка логотипов</li>
                <li>Дизайн интерфейсов</li>
                <li>Создание плакатов</li>
            </ol>
        </section>

        <aside>
            <h3>Любимый стиль дизайна - минимализм</h3>
        </aside>

        <section>
            <h2>Обратная связь</h2>
            <form>
                <input type="text" name="name" placeholder="Ваше имя"><br><br>
                
                <input type="email" name="email" placeholder="Ваш Email"><br><br>
                
                <textarea name="message" placeholder="Ваше сообщение"></textarea><br><br>
                
 
                <button type="submit">Отправить</button>
            </form>
        </section>
    </main>


    <footer>
        <p>&copy; 2026 Ялпута Семён</p>
    </footer>

</body>
</html>
